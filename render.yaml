# ACHAT+ - configuration Render (déploiement gratuit sans carte bancaire)
#
# Architecture : Render = API Express seule (gratuit).
# Les 2 front-ends partent sur Vercel (builds illimités) et appellent
# cette API via VITE_API_URL. La base de données PostgreSQL est Neon.
# La base de données PostgreSQL est Neon (gratuit) — configurez DATABASE_URL
# dans les variables d'environnement du service sur Render.

services:
  - type: web
    name: achat-plus
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@10.20.0 install
    startCommand: cd server && npm start
    healthCheckPath: /api/settings
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_SECRET
        sync: false