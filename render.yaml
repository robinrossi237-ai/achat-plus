# ACHAT+ - configuration Render (déploiement gratuit sans carte bancaire)
#
# Architecture : un seul service Render自由 combine l'API Express + les deux sites SPA.
# La base de données PostgreSQL est Neon (gratuit) — configurez DATABASE_URL
# dans les variables d'environnement du service sur Render.

services:
  - type: web
    name: achat-plus
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@10.20.0 install && BASE_PATH=/ npx --yes pnpm@10.20.0 --filter @workspace/achat-plus run build && BASE_PATH=/admin/ npx --yes pnpm@10.20.0 --filter achat-plus-admin run build
    startCommand: cd server && npm start
    healthCheckPath: /api/settings
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_SECRET
        sync: false